---
- name: "Create elasticsearch certs folder"
  file:
    path: "{{ certs_path }}"
    state: directory
    owner: "{{ owner }}"
    group: "{{ group }}"
    mode: 0750

- name: "Copy ca.crt from /tmp on controller to {{ ca_cert_path }}"
  copy:
    src: "/tmp/elastic/ca/ca.crt"
    dest: "{{ ca_cert_path }}"
    owner: "{{ owner }}"
    group: "{{ group }}"
  notify: restart_elasticsearch

- name: "Copy ca.key from /tmp on controller to {{ ca_key_path }}"
  copy:
    src: "/tmp/elastic/ca/ca.key"
    dest: "{{ ca_key_path }}"
    owner: "{{ owner }}"
    group: "{{ group }}"
  notify: restart_elasticsearch